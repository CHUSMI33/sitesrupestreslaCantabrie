<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <title>Cuevas de Cantabria</title>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Cesium.js"></script>

    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet">

    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
			
		#panel{
			position:absolute;
			top:10px;
			left:10px;
			z-index:1000;
			background:white;
			padding:10px;
}
			
			
        }
    </style>

</head>

<body>

<div id="cesiumContainer"></div>

<script>

 Cesium.Ion.defaultAccessToken =  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlY1eVVYLUV1NjAzd1BOZjkiLCJqdGkiOiI1MGVmNTdjZi04MjNkLTQwYmUtODE5OS0xZjM1MTYyZDA1NmIiLCJpZCI6NTM1NjQ1LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTMwMjEwNDZ9.WIwtaCiZC8KkBy3kVYYHtbAoRK9fiMzlr59Dave79wM';;


const viewer = new Cesium.Viewer('cesiumContainer', {
    terrain: Cesium.Terrain.fromWorldTerrain()
	
	
});
// WMS Cartografía Básica de Cantabria

viewer.imageryLayers.addImageryProvider(

    new Cesium.WebMapServiceImageryProvider({

        url: "https://geoservicios.cantabria.es/inspire/services/Cartografia_Basica_Topografica/MapServer/WMSServer",

        layers: "0",

        parameters: {
            transparent: true,
            format: "image/png"
        }

    })

);
async function cargarDatos() {

    try {

        console.log("Cargando cuevas...");

        const resourceCuevas =
            await Cesium.IonResource.fromAssetId(6088210);

        const cuevas =
            await Cesium.GeoJsonDataSource.load(resourceCuevas);

        await viewer.dataSources.add(cuevas);

        console.log(
            "Cuevas:",
            cuevas.entities.values.length
        );

        const entidadesCuevas =
            cuevas.entities.values;

        for (let i = 0; i < entidadesCuevas.length; i++) {

            const entidad = entidadesCuevas[i];

            if (entidad.properties &&
                entidad.properties.Cueva) {

                entidad.name =
                    entidad.properties.Cueva.getValue();
            }
        }


        console.log("Cargando límites...");

        const resourceLimites =
            await Cesium.IonResource.fromAssetId(6087242);

        const limites =
            await Cesium.GeoJsonDataSource.load(resourceLimites);

        await viewer.dataSources.add(limites);

        console.log(
            "Limites:",
            limites.entities.values.length
        );

   const entidadesLimites = limites.entities.values;

		for (let i = 0; i < entidadesLimites.length; i++) {

			const entidad = entidadesLimites[i];

				if (entidad.polyline) {

        entidad.polyline.width = 4;

        entidad.polyline.material =
            Cesium.Color.RED;

        entidad.polyline.clampToGround = true;
			}
		}

     await viewer.zoomTo(cuevas);

        console.log("Todo cargado correctamente");

    }

    catch (error) {

        console.error(error);

    }
}

cargarDatos();

</script>
<div id="panel">
    Transparencia
    <input
        type="range"
        min="0"
        max="100"
        value="60"
        id="opacidad">
</div>

</body>

</html>
